name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build
      - run: bun run typecheck

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - parallel:
          # Tests import workspace packages from src/ (the "bun" export
          # condition), so they don't need the tsc build; that runs in the
          # typecheck job. --only skips turbo's test -> build dependency.
          - name: Test
            timeout-minutes: 5
            run: bun run test --only --log-order=stream

          # Release binaries are only built on tags, so compile the host
          # binary here, with release.yml's flags, and check that it starts,
          # can open bun:sqlite, and can draw the TUI.
          - name: Compiled binary smoke test
            shell: bash
            env:
              TL_ADAPTER: mock
              NO_COLOR: "1"
            run: |
              bin="$RUNNER_TEMP/tl"
              if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
              bun build --compile --minify --bytecode --format=esm apps/cli/src/index.ts --outfile "$bin"

              export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
              mkdir -p "$HOME"

              expected=$(jq -r .version apps/cli/package.json)
              actual=$("$bin" --version)
              [ "$actual" = "$expected" ] || { echo "::error::tl --version printed '$actual', expected '$expected'"; exit 1; }

              "$bin" glossary add --source hello --target bonjour --from en --to fr
              "$bin" glossary list --from en --to fr | grep -q bonjour
              "$bin" "hello world" --from en --to fr

              # No arguments starts the TUI, which loads OpenTUI's native library
              # through bun:ffi. Without a terminal it still draws a frame, then
              # waits for input until killed. (macOS has no `timeout`.)
              out="$RUNNER_TEMP/tui.out"
              "$bin" < /dev/null > "$out" 2>&1 &
              tui=$!
              for _ in $(seq 40); do grep -q Glossary "$out" && break; sleep 0.5; done
              kill "$tui" 2>/dev/null || true
              grep -q Glossary "$out" || { echo "::error::the TUI did not draw its first frame"; cat "$out"; exit 1; }

  # The one required status check: passes only when every job above passed,
  # so jobs can be added or renamed without touching branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
