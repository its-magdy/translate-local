name: release

on:
  push:
    tags:
      - "v*"

# Read-only by default; only the release job can write (to create the release).
permissions:
  contents: read

# Never cancel a release halfway; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Check the tag and the Homebrew tap access before building anything. A
  # publish token once expired between releases and left a release
  # half-published. npm needs no check: it publishes through trusted publishing.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag pushed without the version bump would ship binaries and npm
      # packages that report the previous version.
      - name: Tag matches package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          bad=0
          for f in packages/*/package.json apps/*/package.json; do
            v=$(jq -r .version "$f")
            if [ "$v" != "$version" ]; then
              echo "::error file=$f::$f is $v, tag is $GITHUB_REF_NAME. Bump every package.json before tagging."
              bad=1
            fi
          done
          exit $bad

      # Fails if the GitHub App secrets are missing, or the App is not installed
      # on homebrew-tap with Contents: write (needed for repository_dispatch).
      - name: Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: its-magdy
          repositories: homebrew-tap
          permission-contents: write

      - name: Homebrew tap is reachable
        run: gh api repos/its-magdy/homebrew-tap --silent
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}

  build:
    name: build (${{ matrix.target.name }})
    needs: preflight
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: darwin-arm64, bun: bun-darwin-arm64, os: macos-latest  }
          - { name: darwin-x64,   bun: bun-darwin-x64,   os: macos-15-intel }
          - { name: linux-x64,    bun: bun-linux-x64,    os: ubuntu-latest }
          - { name: linux-arm64,  bun: bun-linux-arm64,  os: ubuntu-24.04-arm }
          - { name: windows-x64,  bun: bun-windows-x64,  os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Each target builds on its native OS so platform-specific optional deps
      # (opentui, bun:sqlite) install and bundle correctly without cross-compilation hacks.
      # --bytecode precompiles the JS so the binary starts faster. On its own it
      # emits cjs, which rejects the CLI's top-level await, hence --format=esm.
      # --sourcemap embeds a source map so crash stack traces point at the .ts
      # sources instead of minified code.
      # ci.yml and apps/cli's build:bin use the same flags; keep them in sync.
      - name: Compile binary
        shell: bash
        working-directory: apps/cli
        run: |
          mkdir -p dist
          OUT="dist/tl-${{ matrix.target.name }}"
          if [ "${{ matrix.target.name }}" = "windows-x64" ]; then
            OUT="${OUT}.exe"
          fi
          bun build --compile --minify --sourcemap --bytecode --format=esm \
            --target=${{ matrix.target.bun }} \
            ./src/index.ts \
            --outfile "$OUT"
          # The binary embeds the map; the separate .map copy would otherwise
          # match the upload glob and ship as a release asset.
          rm -f "$OUT.map"

      # Ad-hoc sign macOS binaries so Gatekeeper doesn't kill them on Apple Silicon / macOS 15+.
      # This uses the free "-s -" identity (no Apple Developer account needed).
      # Bun's JIT engine requires the entitlements below to run under the hardened runtime.
      - name: Ad-hoc codesign (macOS only)
        if: startsWith(matrix.target.name, 'darwin')
        shell: bash
        working-directory: apps/cli/dist
        run: |
          codesign \
            --entitlements "${{ github.workspace }}/scripts/entitlements.plist" \
            --force -s - \
            "tl-${{ matrix.target.name }}"
          echo "Signed tl-${{ matrix.target.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tl-${{ matrix.target.name }}
          path: apps/cli/dist/tl-${{ matrix.target.name }}*
          if-no-files-found: error

  publish-npm:
    name: publish npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage platform packages
        run: node scripts/stage-npm-packages.mjs "${GITHUB_REF_NAME#v}"

      # npm authenticates with trusted publishing (OIDC via id-token: write), so
      # there is no token to expire. Fails on real errors (e.g. a package without
      # a trusted publisher for release.yml); skips versions
      # that are already published or still staged, so re-running the job is safe.
      # The platform packages are independent, so they publish in parallel
      # (~12s each when run one after another).
      - parallel:
          - name: Publish darwin-arm64
            run: scripts/npm-publish.sh packages/npm-tl-darwin-arm64
          - name: Publish darwin-x64
            run: scripts/npm-publish.sh packages/npm-tl-darwin-x64
          - name: Publish linux-x64
            run: scripts/npm-publish.sh packages/npm-tl-linux-x64
          - name: Publish linux-arm64
            run: scripts/npm-publish.sh packages/npm-tl-linux-arm64
          - name: Publish win32-x64
            run: scripts/npm-publish.sh packages/npm-tl-win32-x64

      # Last, so the wrapper never points at platform packages that failed.
      - name: Publish wrapper package
        run: scripts/npm-publish.sh packages/npm-tl

  release:
    name: release
    # After npm, so a failed publish leaves no GitHub Release or Homebrew bump.
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          ls -lh
          sha256sum tl-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: its-magdy
          repositories: homebrew-tap
          permission-contents: write

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh api repos/its-magdy/homebrew-tap/dispatches \
            --method POST \
            --field event_type=tl-release \
            --field client_payload[version]="${VERSION#v}"
