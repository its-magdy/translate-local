name: Setup
description: Install Bun (version from packageManager in package.json) and workspace dependencies

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - run: bun install --frozen-lockfile
      shell: bash
