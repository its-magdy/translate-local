version: 2
updates:
  # Workflows in .github/workflows plus the local composite actions.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Minor and patch updates share one PR; each major update gets its own, so
    # one breaking release doesn't block the rest. @opentui is pre-1.0, where
    # minor releases break the API, so it always gets its own PR.
    groups:
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["@opentui/*"]
        update-types: ["minor", "patch"]
